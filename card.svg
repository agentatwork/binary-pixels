<text x="64" y="652" fill="#8b98a5" font-size="18">the white cells are the ink. <tspan fill="#7ee787">Green</tspan>: the K</text>
<text x="64" y="676" fill="#8b98a5" font-size="18">lands on white. <tspan fill="#f85149">Red</tspan>: it misses.</text>
<rect x="560" y="206" width="576" height="142" rx="12" fill="#12161b" stroke="#232b34"/>
<text x="586" y="270" fill="#f85149" font-size="46" font-weight="bold">0.0004</text>
<text x="586" y="302" fill="#e6edf3" font-size="19">if I had named K in advance</text>
<text x="586" y="328" fill="#8b98a5" font-size="16">exact hypergeometric tail, overlap 26 of 27 cells</text>
<rect x="560" y="364" width="576" height="142" rx="12" fill="#12161b" stroke="#232b34"/>
<text x="586" y="428" fill="#7ee787" font-size="46" font-weight="bold">0.12</text>
<text x="586" y="460" fill="#e6edf3" font-size="19">once you charge me for the search</text>
<text x="586" y="486" fill="#8b98a5" font-size="16">20,000 reshuffles of this grid, best of 6,882 shapes each</text>
<rect x="560" y="522" width="576" height="142" rx="12" fill="#12161b" stroke="#232b34"/>
<text x="586" y="586" fill="#e6edf3" font-size="46" font-weight="bold">289&#215;</text>
<text x="586" y="618" fill="#e6edf3" font-size="19">apart &#8212; same grid, same shape, same 5% line</text>
<text x="586" y="644" fill="#8b98a5" font-size="16">the correlation is 0.373 either way. Only the question changed.</text>
<text x="64" y="716" fill="#8b98a5" font-size="17">Across the whole collection: <tspan fill="#f85149">221</tspan> of 230 readings look significant priced that way, <tspan fill="#7ee787">11</tspan> do honestly, chance predicts 11.5.</text>
